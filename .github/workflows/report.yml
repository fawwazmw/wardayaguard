name: Report

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

# Pages deployments must not be cancelled by a newer commit mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish HTML report
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # A rerun re-executes the job, including the Pages artifact upload. If an
      # artifact from an earlier attempt still exists, deploy-pages fails with
      # "Multiple artifacts named github-pages". Remove it first so a rerun is
      # always safe.
      - name: Remove stale Pages artifacts from earlier attempts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' |
          while read -r artifact_id; do
            if [ -n "$artifact_id" ]; then
              echo "Deleting stale github-pages artifact ${artifact_id}"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            fi
          done

      - name: Download report artifact from the CI run
        uses: actions/download-artifact@v8
        with:
          name: playwright-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifact

      - name: Prepare the site
        run: |
          mkdir -p _site
          cp -r artifact/playwright-report/. _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
