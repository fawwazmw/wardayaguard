name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, unit, API and UI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build storefront
        run: npm run build:web

      # One run for both projects so the HTML report contains API and UI
      # results together. Two separate runs would overwrite the report.
      # Firefox and WebKit run in the nightly matrix, not on every PR.
      - name: API and Chromium tests
        run: npm run test:ci

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t wardayaguard:ci .

      - name: Smoke test the container
        run: |
          docker run -d --name wardayaguard -p 4000:4000 -e ALLOW_TEST_ROUTES=0 wardayaguard:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/api/health > /dev/null; then
              break
            fi
            sleep 2
          done

          echo "health:"
          curl -fsS http://127.0.0.1:4000/api/health
          echo
          echo "storefront:"
          curl -fsS http://127.0.0.1:4000/ | grep -q '<div id="root"></div>'
          echo "index served"

          docker logs wardayaguard
          docker rm -f wardayaguard
